[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rishu", email = "suryodipta@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "ddgs>=9.15.0",
    "docx2txt>=0.9",
    "fastapi>=0.141.1",
    "fastapi-users[beanie]>=15.0.5",
    "google-api-python-client>=2.199.0",
    "httpx>=0.28.1",
    "langchain>=1.3.16",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-huggingface>=1.2.2",
    "langchain-mistralai>=1.1.6",
    "mistralai>=2.9.4",
    "motor>=3.7.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pygithub>=2.10.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
